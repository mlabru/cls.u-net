# Centro Logístico de Simulação Meteorológica
# Copyright (c) 1995-2026, Instituto de Controle do Espaço Aéreo
#
# config.ini do 25.u-net: "como" o algoritmo roda (janelas, treino, backends).
# Os caminhos ("onde") vêm da CLI e das variáveis UNT_* (unt_cfg.sh).
# Precedência: CLI > este arquivo > defaults de apps/work/unt_config.py.
# Uma opção de [treino] repetida na seção de um backend vale só para ele.

[janelas]

# cadência nominal dos volumes e resíduo máximo da associação encadeada (s);
# tolerancia_s <= intervalo_s / 2 (mesma regra do Timeline do 27.nowcast)
intervalo_s = 600
tolerancia_s = 300

# quadros de entrada e passos-alvo (+10..+60 min)
num_entradas = 4
num_alvos = 6

# cada CAPPI da janela precisa de valid_fraction >= min_valid_ratio x a maior
# da série (mesmo critério do nwcSequences); média mínima de rain_fraction das
# entradas (0 = sem filtro)
min_valid_ratio = 0.95
min_rain_fraction = 0.0

# split temporal por bloco (padrão: dia UTC); o resto é teste
frac_treino = 0.70
frac_validacao = 0.15
bloco_split_s = 86400


[treino]

# auto = cuda se houver GPU, senão cpu
device = auto

epocas = 50
batch = 8
lr = 3e-4
paciencia = 8

# lado do recorte aleatório (px, múltiplo de 32; 0 = grade inteira).
# CPU: 128; GPU: 256 ou 0
recorte_px = 256

# largura do 1º nível (64 = artigos). CPU: 16 ou 32
largura_base = 64

# processos do DataLoader
workers = 2
semente = 42

# precisão mista (só tem efeito em cuda)
amp = true

# espelhamentos e rotações de 90° no treino
augment = true

# recorte aceito com ao menos esta fração de pixels com eco (>= 10 dBZ)
min_eco_recorte = 0.01
tentativas_recorte = 10

# janelas de treino por época (0 = todas). Todos os backends fazem o mesmo número
# de passos por época: no pytorch (um item por janela x lead) sorteia-se um lead
amostras_por_epoca = 0

# melhor época e early stopping: metrica (CSI/FSS do rollout completo na
# validação, limiar/escala do [promocao]) ou perda
selecao = metrica

# métrica a cada val_cada épocas, em até max_janelas_val janelas (0 = todas).
# 32 janelas (~1 por dia de validação) deram uma métrica ruidosa demais para escolher
# a época (2026-10: rainnet 0,23 -> 0,10 -> 0,19 em épocas vizinhas)
val_cada = 1
max_janelas_val = 500

# só janelas com ao menos este número de pixels >= limiar do [promocao] em algum alvo
# entram na métrica (0 = todas); janela sem evento não muda CSI/FSS
min_pixels_evento_val = 100

# norma máxima do gradiente (0 = sem corte)
clip_grad = 1.0

# fração máxima de lotes com perda não finita (NaN/inf) numa época, no treino ou na
# validação; acima dela o treino para com erro e a retomada da época anterior fica.
# 2026-10: o rainnet descartava em silêncio de 781 a 17.398 lotes por época (float16)
max_nao_finitos = 0.01

# rainnet/smaat: saída constante depois de passos_colapso passos da 1ª época = rede
# colapsada (ReLUs mortas); recomeça com a semente seguinte, até tentativas_colapso
# vezes (0 = sem verificação). 2026-10-31: o rainnet colapsou com 3 de 9 sementes
# (inclusive a 42 e a 43) nos primeiros 50 passos; o A/B de 30/10 perdeu V0 e V1 assim
passos_colapso = 200
tentativas_colapso = 5

# seleção pela métrica: média móvel das últimas N métricas (1 = a da época). Com a
# métrica ruidosa, a média evita escolher um pico isolado
media_metrica = 1

# rainnet/smaat: perda de regressão ponderada pela faixa de intensidade do alvo.
# limites em dBZ (crescentes) e um peso por faixa (len(limites) + 1); vazio = artigos
limites_peso_dbz =
peso_dbz =


[pytorch]

# rede própria ICEA-Google (entropia cruzada sobre bins de intensidade)
lr = 1e-3

# limites (dBZ) dos bins: len + 1 classes. Incluem os limiares da verificação
# (20, 30, 36), para que o centro de um bin não fique do outro lado do limiar
bins_dbz = 10,20,25,30,36,40,45,50,55

# peso de cada classe na entropia cruzada (len(bins_dbz) + 1 valores), ou auto
# (raiz do inverso da frequência nos alvos de treino, gravado no checkpoint)
# 2026-10: com os pesos fixos 1..10 o pytorch quase nunca prevê os bins altos em
# leads longos (freq_bias36 0,02 no passo 6). Com auto (2026-10-23: 1, 7,4, 11,4, 14,4,
# 20, 41, 50...) a chuva fraca infla: na época 2, freq_bias20 1,36 -> 1,81 e viés
# +2,5 -> +3,9 dBZ (passos 1 -> 6) -- o peso de 10-20 dBZ 7x o de "sem eco" desloca a
# fronteira eco/sem eco. Aqui: abaixo de 30 dBZ como antes (1,1,2,2); só os bins >= 30
# ganham mais peso
peso_bins = 1,1,2,2,4,8,10,12,15,20

blocos_por_nivel = 2


[rainnet]

# artigo: Adam lr 3e-4, perda log-cosh
lr = 3e-4

# passos realimentados no treino ([treino] passos_rollout; o artigo usa 1). Treinado
# só em t+1, o rainnet atenua o eco a cada passo da previsão (2026-10: bias -2,5 ->
# -5,2 dBZ e dias inteiros com FSS 0 no passo 3)
passos_rollout = 3

# com 3 passos e batch 8 o rainnet (largura 64, recorte 256) estoura a memória da
# RTX 5050 (2026-10-22: CUDA out of memory no rollout, 7,4 GB em uso); com batch 4 cabe.
# O número de janelas por época continua o mesmo dos outros backends
batch = 4

# 2026-10-30: métrica de validação 0,14..0,39 entre épocas vizinhas; o early stopping
# escolheu um pico isolado (época 6 de 14) com a perda de validação ainda caindo
media_metrica = 3

# 2026-10-30: sem peso, o rainnet atenua o eco (viés -2,4 dBZ em +10 min a -3,7 em
# +60; viés de frequência a 30 dBZ ~0,65). A/B de 2026-11-02 (9 épocas x 40.000
# janelas, 2.000 janelas de validação reservadas): com estes pesos, viés -3,5 -> -2,7
# dBZ (sem: -6,0 -> -8,3), FSS30@20km a +60 0,393 (sem: 0,269; persistência 0,301),
# acima da persistência com significância em todos os leads. Rollout de 6 passos não
# ganhou da versão com 3. Ainda abaixo da meta: viés de frequência a 30 dBZ ~0,62
limites_peso_dbz = 20, 30, 36
peso_dbz = 1, 2, 4, 6


[smaat]

# artigo: Adam lr 1e-3, perda MSE
lr = 1e-3
kernels_per_layer = 2
reduction_ratio = 16

# recursivo (t+1 realimentado, como o rainnet) ou direto (6 saídas)
modo = recursivo

# passos realimentados no treino (só no recursivo). Treinado só em t+1, o smaat infla
# a chuva a cada passo (2026-10: bias 0 no passo 1, +2,5 dBZ a partir do 2)
passos_rollout = 3

# com 3 passos e batch 8 o smaat (largura 64, recorte 256) estoura os 8 GB da RTX 5050
# (2026-10: K=3 batch 4 = 4,4 GB, 0,32 s/lote).
# O número de janelas por época continua o mesmo dos outros backends
batch = 4


[promocao]

# portão do untPromove: o candidato só vira atual.pt se, em cada passo abaixo,
#   CSI e FSS >= os do atual - tolerancia   e   > os da persistência + margem
# (sem atual.pt, só a comparação com a persistência)
passos = 3,6
limiar_dbz = 30
escala_fss_km = 20
tolerancia = 0.01
margem_persistencia = 0.0

# conjunto do manifesto exigido no comparacao.json
split = teste

# o mesmo critério por par radar/alcance (resultados_por_par do untEval), só como
# alerta: o portão decide pelo agregado. Pares com menos janelas não são julgados
min_janelas_par = 20

# exige também que o intervalo de confiança da diferença candidato - persistência
# (bootstrap por bloco do split, [avaliacao]) fique todo acima de margem_persistencia,
# em cada passo, no CSI e no FSS. Precisa de somas_por_bloco no comparacao.json e de
# ao menos min_blocos blocos (com poucos, o intervalo não significa nada)
significancia = true
min_blocos = 5


[avaliacao]

# bootstrap pareado por bloco (dia UTC) do untEval: reamostragens, nível do intervalo
# percentil bilateral e semente (o untPromove usa os mesmos, para os mesmos intervalos)
reamostras = 2000
nivel_confianca = 0.90
semente = 42


[monitor]

# untMonitor: skill em operação (verify.jsonl do unt_run.sh com UNT_VERIFY=true)
# numa janela móvel. Alarme quando a pontuação (CSI/FSS no limiar/escala do
# [promocao]) de um backend fica abaixo da persistência - margem, com ao menos
# min_verificacoes verificações com evento
janela_h = 24
min_verificacoes = 12
margem = 0.0
